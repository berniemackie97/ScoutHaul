name: Bug
description: Report a reproducible defect or violated business invariant.
title: "[Bug] "
labels:
  - "type:bug"
body:
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - API and persistence
        - Admin
        - Storefront
        - Mobile
        - Browser extension
        - Cross-surface
        - CI or operations
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Business impact and affected state
      description: Describe the customer/operator impact, including whether money, inventory, data access or historical records are affected. Do not post secrets or customer details.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include exact preconditions, input, steps and observed result. If not reproducible, describe the evidence and uncertainty.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected invariant
    validations:
      required: true
  - type: textarea
    id: diagnosis
    attributes:
      label: Evidence and existing implementation
      description: Relevant files, endpoints, tests, logs without sensitive data, or PRs. Do not prescribe a speculative solution.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Regression acceptance
      description: Include a failing test or other independent reproduction, the success path, failure/retry case, and evidence needed to close.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies, rollout and known limits
    validations:
      required: false
