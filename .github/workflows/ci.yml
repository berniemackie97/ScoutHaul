name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish_image:
        description: 'Publish API image to GHCR'
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '25.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/scouthaul-api

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore services/api/HaulScout.slnx

      - name: Format check
        working-directory: services/api
        run: dotnet format HaulScout.slnx --verify-no-changes --verbosity minimal

      - name: Build
        run: dotnet build services/api/HaulScout.slnx --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test services/api/HaulScout.slnx --configuration Release --no-build

      - name: NuGet vulnerability audit
        working-directory: services/api
        run: dotnet list HaulScout.slnx package --vulnerable --include-transitive

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install
        working-directory: apps/mobile
        run: npm ci

      - name: Expo dependency check
        working-directory: apps/mobile
        run: npx expo install --check

      - name: Typecheck
        working-directory: apps/mobile
        run: npm run typecheck

      - name: npm vulnerability audit
        working-directory: apps/mobile
        run: npm audit --audit-level=high

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check (shared packages + apps)
        run: pnpm --filter @overhaul/api-client --filter @overhaul/ui --filter @overhaul/storefront --filter @overhaul/admin type-check

      - name: Build storefront + admin
        run: pnpm --filter @overhaul/storefront --filter @overhaul/admin build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs:
      - backend
      - mobile
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: services/api
          file: services/api/src/HaulScout.Api/Dockerfile
          load: true
          push: false
          tags: scouthaul-api:ci
          build-args: |
            SOURCE_REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compose smoke test
        run: |
          set -euo pipefail
          docker compose up -d --build
          api_ready=false
          for attempt in {1..45}; do
            if curl -fsS http://localhost:5080/health; then
              api_ready=true
              break
            fi
            sleep 2
          done
          if [ "$api_ready" != "true" ]; then
            echo "::error::API health endpoint did not become ready"
            docker compose ps
            docker compose logs --no-color api postgres db-seed
            exit 1
          fi
          curl -fsS http://localhost:5080/swagger/v1/swagger.json > /tmp/scouthaul-openapi.json
          seed_container="$(docker compose ps -aq db-seed)"
          for attempt in {1..45}; do
            seed_status="$(docker inspect -f '{{.State.Status}}' "$seed_container" 2>/dev/null || true)"
            if [ "$seed_status" = "exited" ]; then
              break
            fi
            sleep 2
          done
          test "$(docker inspect -f '{{.State.ExitCode}}' "$seed_container")" = "0"
          docker compose exec -T postgres psql -U scouthaul -d scouthaul -Atc 'select count(*) from "Organizations";' | grep -qx '1'

      - name: Dump compose logs
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color api postgres db-seed || true

      - name: Docker metadata
        id: meta
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_image == 'true'))
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=HaulScout ASP.NET Core API
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_image == 'true'))
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish API image to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_image == 'true'))
        uses: docker/build-push-action@v6
        with:
          context: services/api
          file: services/api/src/HaulScout.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Stop Compose
        if: always()
        run: docker compose down --volumes --remove-orphans || true
